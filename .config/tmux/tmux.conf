# Quick reload of the configs
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Change the prefix binding
unbind C-b
set -g prefix C-s
bind-key C-s send-prefix

# Enable mouse
set -g mouse on

# Fix the colors for SSH connections
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"

# Clipboard related
set -g set-clipboard on
set-window-option -g mode-keys vi # enable VIM motions in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"
unbind -T copy-mode-vi MouseDragEnd1Pane

# Split pane
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Numbering of windows, panes
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Binding to change windows
bind -n M-& select-window -t 1
bind -n M-é select-window -t 2
bind -n 'M-"' select-window -t 3
bind -n "M-'" select-window -t 4
bind -n M-( select-window -t 5
bind -n M-- select-window -t 6
bind -n M-è select-window -t 7
bind -n M-_ select-window -t 8

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Status line
# set -g focus-events on
# set -g status-position top
# set -g status-right-length 90
# set -g status-left-length 90
# set -g status-justify centre
set -g status-right ""
set -g @catppuccin_window_default_text " #W" # bug in names of windows
set -g @catppuccin_window_current_text " #W" # bug in names of windows
# set -g @catppuccin_window_status_style "rounded"
# run '~/.config/tmux/catppuccin/catppuccin.tmux' # catpuccin style
set-option -g status-style bg=default
set-option -g allow-rename off
set-window-option -g automatic-rename off
